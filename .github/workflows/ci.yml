name: G-Krusch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Hardening & Invariant Suite (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Zero Hardcoded Host Paths (INV-12)
        run: |
          ! grep -rn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.agent "/home/krusch" src/ test/ client/ bin/ *.md

      - name: Verify Supply Chain Security
        run: npm audit --audit-level=high

      - name: Run Hermetic Test Suite
        run: |
          npm test 2>&1 | tee test.log

      - name: Instant Failure Push Notification
        if: failure()
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          if [ -n "${NTFY_TOPIC_URL:-}" ]; then
            ERR_SNIPPET=$(tail -n 25 test.log 2>/dev/null || echo "No test log found")
            curl -s -X POST \
              -H "Title: 🚨 CI Failure: $GITHUB_REPOSITORY (Node 22)" \
              -H "Priority: urgent" \
              -H "Tags: rotating_light,x" \
              -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -d "Run #$GITHUB_RUN_NUMBER failed on $GITHUB_REF_NAME. Commit: $GITHUB_SHA by $GITHUB_ACTOR. $ERR_SNIPPET" \
              "$NTFY_TOPIC_URL" || true
          fi

